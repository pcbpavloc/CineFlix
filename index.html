<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CINEFLIX - Buscador de Películas</title>
    <style>
        :root {
            --primary-blue: #3498db;
            --dark-blue: #2980b9;
            --green: #2ecc71;
            --orange: #f39c12;
            --red: #e74c3c;
            --bg-color: #f4f6f9;
            --text-color: #333;
            --history-bg: #eaf2f8;
            /* 👇 Tamaño tipo celular para PC */
            --app-width: 360px;
            --app-height: 780px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .app-container {
            width: var(--app-width);
            height: var(--app-height);
            background: white;
            padding: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .app-container::-webkit-scrollbar { width: 6px; }
        .app-container::-webkit-scrollbar-track { background: transparent; }
        .app-container::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
        .app-container::-webkit-scrollbar-thumb:hover { background: #aaa; }

        /* ===== ENCABEZADO ===== */
        header {
            text-align: center;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-shrink: 0;
        }

        h1 {
            font-size: 2em;
            color: #2c3e50;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-config {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 1.3em;
            cursor: pointer;
            color: #555;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .btn-config:hover { background: #eee; }

        /* ===== BARRA DE BÚSQUEDA ===== */
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f0f2f5;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }

        input[type="text"]:focus { border-color: var(--primary-blue); }

        .btn-search {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-search:hover { background-color: var(--dark-blue); }

        /* ===== BOTONES DE ACCESO RÁPIDO ===== */
        .quick-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .btn-link {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 9px 5px;
            font-size: 11px;
            cursor: pointer;
            text-align: center;
            color: #333;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-link:hover { background-color: #f9f9f9; border-color: #999; }

        .btn-green {
            background-color: var(--green);
            color: white;
            border: none;
        }

        .btn-green:hover { background-color: #27ae60; }

        /* ===== SECCIÓN HISTORIAL ===== */
        .history-section {
            background-color: var(--history-bg);
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .history-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .history-list {
            background: white;
            border-radius: 8px;
            min-height: 60px;
            max-height: 100px;
            overflow-y: auto;
            padding: 8px;
            font-size: 11px;
            margin-bottom: 8px;
            border: 1px solid #e0e0e0;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #eee;
        }

        .history-item:last-child { border-bottom: none; }

        .btn-clear {
            background-color: var(--red);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            float: right;
        }

        .btn-clear:hover { background-color: #c0392b; }

        /* ===== CONSOLA DE LOG ===== */
        .log-console {
            background-color: #f0f0f0;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 10px;
            color: #666;
            height: 60px;
            overflow-y: auto;
            font-family: monospace;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            flex-shrink: 0;
        }

        /* ===== BOTÓN DE DONACIÓN ===== */
        .btn-coffee {
            background-color: var(--orange);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
            flex-shrink: 0;
            margin-top: auto;
        }

        .btn-coffee:hover { background-color: #e67e22; }

        /* ===== MODAL DE CONFIGURACIÓN ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 340px;
            max-height: 90vh;
            border-radius: 15px;
            padding: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            font-size: 17px;
        }

        .modal-content h3 {
            font-size: 13px;
            color: #555;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        .site-list {
            list-style: none;
            padding: 0;
            margin: 0 0 12px 0;
            border: 1px solid #eee;
            border-radius: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .site-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            font-size: 12px;
        }

        .site-item:last-child { border-bottom: none; }

        .site-item .site-name {
            font-weight: bold;
            color: #333;
        }

        .site-item .site-url {
            font-size: 10px;
            color: #888;
            display: block;
            word-break: break-all;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 12px;
            line-height: 22px;
            text-align: center;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .btn-delete:hover { background: #c0392b; }

        .add-site-form {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px dashed #ccc;
        }

        .add-site-form input {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }

        .add-site-form input:focus { border-color: var(--primary-blue); }

        .btn-add {
            background-color: var(--green);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
        }

        .btn-add:hover { background-color: #27ae60; }

        .btn-close-modal {
            background-color: #95a5a6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }

        .btn-close-modal:hover { background-color: #7f8c8d; }

        .btn-reset {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 7px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 8px;
        }

        .btn-reset:hover { background-color: #d35400; }

        /* ============================================================
           💻 PANTALLAS BAJAS: Reducir altura si no cabe
           ============================================================ */
        @media (min-width: 501px) and (max-height: 820px) {
            :root {
                --app-height: 95vh;
            }
        }

        /* ============================================================
           📱 MÓVIL: La app ocupa TODA la pantalla
           ============================================================ */
        @media (max-width: 500px) {
            body {
                padding: 0;
                align-items: stretch;
                overflow: hidden;
            }

            .app-container {
                width: 100vw;
                height: 100vh;
                max-width: none;
                max-height: none;
                border-radius: 0;
                box-shadow: none;
                padding: 15px;
                padding-top: max(15px, env(safe-area-inset-top));
                padding-bottom: max(15px, env(safe-area-inset-bottom));
                padding-left: max(15px, env(safe-area-inset-left));
                padding-right: max(15px, env(safe-area-inset-right));
            }

            /* Evita zoom en iOS al escribir */
            input[type="text"] {
                font-size: 16px;
            }

            h1 {
                font-size: 2em;
            }

            .btn-link {
                font-size: 12px;
                padding: 10px 5px;
            }

            .btn-search {
                font-size: 16px;
                padding: 14px;
            }

            .btn-coffee {
                font-size: 14px;
                padding: 14px;
            }

            .modal-content {
                max-width: none;
                width: 100%;
                max-height: 95vh;
            }
        }

        /* ============================================================
           📱 MÓVILES MUY PEQUEÑOS (< 340px)
           ============================================================ */
        @media (max-width: 340px) {
            .app-container {
                padding: 12px;
            }

            h1 {
                font-size: 1.7em;
            }

            .btn-link {
                font-size: 10px;
                padding: 8px 4px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>CINEFLIX</h1>
        <button class="btn-config" onclick="abrirModal()" title="Gestionar páginas de búsqueda">⚙️</button>
    </header>

    <div class="search-box">
        <input type="text" id="movieInput" placeholder="Escribe el título de la película..." autocomplete="off">
        <button class="btn-search" onclick="realizarBusqueda()">BUSCAR</button>
    </div>

    <div class="quick-links">
        <button class="btn-link" onclick="abrirEnlace('https://pluto.tv/latam/watch/live-tv/19723/')">PLUTO TV</button>
        <button class="btn-link" onclick="abrirEnlace('https://app.plex.tv/desktop/#!/live-tv')">PLEX TV</button>
        <button class="btn-link" onclick="abrirEnlace('https://canela.tv/epg')">CANELA TV</button>
        <button class="btn-link btn-green" onclick="abrirEnlace('https://futbollibrefullhd.org/')">FÚTBOL ⚽</button>
    </div>

    <div class="history-section">
        <div class="history-header">
            <span>📄 HISTORIAL</span>
        </div>
        <div class="history-list" id="historyList"></div>
        <button class="btn-clear" onclick="limpiarHistorial()">🗑️ Limpiar</button>
        <div style="clear: both;"></div>
    </div>

    <div class="log-console" id="logConsole">
        > Esperando acciones...
    </div>

    <button class="btn-coffee" onclick="abrirEnlace('https://www.paypal.com/donate/?hosted_button_id=X6ZL5L48EFYM8')">
        ☕ INVITAME UN CAFE
    </button>
</div>

<!-- ============ MODAL DE CONFIGURACIÓN ============ -->
<div class="modal-overlay" id="modalConfig">
    <div class="modal-content">
        <h2>⚙️ Gestionar Páginas</h2>
        <p style="font-size:12px; color:#777; text-align:center; margin-top:-8px;">
            Agrega o elimina sitios de búsqueda. Usa <b>X</b> como marcador para el título.
        </p>
        
        <h3>📋 Páginas actuales</h3>
        <ul class="site-list" id="siteList"></ul>

        <button class="btn-reset" onclick="restaurarPorDefecto()">🔄 Restaurar lista por defecto</button>

        <h3>➕ Agregar nueva página</h3>
        <div class="add-site-form">
            <input type="text" id="newSiteName" placeholder="Nombre (ej: MiSitio)">
            <input type="text" id="newSiteUrl" placeholder="URL con X (ej: https://misitio.com/search/X)">
            <button class="btn-add" onclick="agregarSitio()">Añadir Página</button>
        </div>

        <button class="btn-close-modal" onclick="cerrarModal()">Cerrar</button>
    </div>
</div>

<script>
    // --- CONFIGURACIÓN POR DEFECTO DE LAS URLs ---
    const SITIOS_POR_DEFECTO = [
        { nombre: "TioPlus", url: "https://tioplus.app/search/X" },
        { nombre: "CineCalidad", url: "https://www.cinecalidad.my/?s=X" },
        { nombre: "EliteTorrent", url: "https://www.elitetorrent.com/?s=X" },
        { nombre: "PelisPanda", url: "https://pelispanda.org/search/?query=X" },
        { nombre: "PelicineHD", url: "https://pelicinehd.com/?s=X" },
        { nombre: "EstrenosCinesAA", url: "https://www.estrenoscinesaa.com/?s=X" },
        { nombre: "VerPeliculasUltra", url: "https://verpeliculasultra.com/index.php?do=search&subaction=search&story=X" },
        { nombre: "OfficialMovieBox", url: "https://officialmoviebox.com/newWeb/searchResult?keyword=X" }
    ];

    let sitiosBusqueda = [];
    let busquedaEnProgreso = false;

    // --- CARGA INICIAL ---
    function cargarSitios() {
        const guardados = localStorage.getItem('cineflixSites');
        if (guardados) {
            try {
                sitiosBusqueda = JSON.parse(guardados);
                if (!Array.isArray(sitiosBusqueda) || sitiosBusqueda.length === 0) {
                    sitiosBusqueda = [...SITIOS_POR_DEFECTO];
                }
            } catch (e) {
                sitiosBusqueda = [...SITIOS_POR_DEFECTO];
            }
        } else {
            sitiosBusqueda = [...SITIOS_POR_DEFECTO];
        }
    }

    function guardarSitios() {
        localStorage.setItem('cineflixSites', JSON.stringify(sitiosBusqueda));
    }

    // --- GESTIÓN DEL MODAL ---
    function abrirModal() {
        renderizarListaSitios();
        document.getElementById('modalConfig').classList.add('active');
    }

    function cerrarModal() {
        document.getElementById('modalConfig').classList.remove('active');
    }

    function renderizarListaSitios() {
        const lista = document.getElementById('siteList');
        lista.innerHTML = '';

        if (sitiosBusqueda.length === 0) {
            lista.innerHTML = '<li style="padding:15px; text-align:center; color:#999;">No hay páginas. Agrega una.</li>';
            return;
        }

        sitiosBusqueda.forEach((sitio, index) => {
            const li = document.createElement('li');
            li.className = 'site-item';
            li.innerHTML = `
                <div style="flex:1; min-width:0;">
                    <span class="site-name">${sitio.nombre}</span>
                    <span class="site-url">${sitio.url}</span>
                </div>
                <button class="btn-delete" onclick="eliminarSitio(${index})" title="Eliminar">✕</button>
            `;
            lista.appendChild(li);
        });
    }

    function agregarSitio() {
        const nombreInput = document.getElementById('newSiteName');
        const urlInput = document.getElementById('newSiteUrl');
        const nombre = nombreInput.value.trim();
        const url = urlInput.value.trim();

        if (nombre === "" || url === "") {
            alert("Por favor, rellena ambos campos (Nombre y URL).");
            return;
        }

        if (!url.includes('X')) {
            alert("La URL debe contener una 'X' que será reemplazada por el título buscado.\n\nEjemplo: https://misitio.com/search/X");
            return;
        }

        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            alert("La URL debe comenzar con http:// o https://");
            return;
        }

        sitiosBusqueda.push({ nombre: nombre, url: url });
        guardarSitios();
        renderizarListaSitios();
        nombreInput.value = '';
        urlInput.value = '';
        log(`✅ Añadido: ${nombre}`);
    }

    function eliminarSitio(index) {
        const sitio = sitiosBusqueda[index];
        if (confirm(`¿Eliminar "${sitio.nombre}" de la lista de búsqueda?`)) {
            sitiosBusqueda.splice(index, 1);
            guardarSitios();
            renderizarListaSitios();
            log(`🗑️ Eliminado: ${sitio.nombre}`);
        }
    }

    function restaurarPorDefecto() {
        if (confirm("¿Restaurar la lista original de páginas? Se perderán tus cambios.")) {
            sitiosBusqueda = [...SITIOS_POR_DEFECTO];
            guardarSitios();
            renderizarListaSitios();
            log("🔄 Lista restaurada por defecto.");
        }
    }

    // --- BÚSQUEDA ---
    function realizarBusqueda() {
        const input = document.getElementById('movieInput');
        const query = input.value.trim();

        if (query === "") {
            alert("Por favor, escribe el título de una película.");
            return;
        }

        if (sitiosBusqueda.length === 0) {
            alert("No hay páginas de búsqueda configuradas. Añade una con el engranaje ⚙️.");
            return;
        }

        if (busquedaEnProgreso) {
            log("⏳ Ya hay una búsqueda en progreso, espera...");
            return;
        }

        busquedaEnProgreso = true;
        log(`🔍 Iniciando búsqueda de: "${query}"...`);
        guardarEnHistorial(query);

        abrirVentanaBusqueda(query, 0);

        for (let i = 1; i < sitiosBusqueda.length; i++) {
            setTimeout(() => {
                abrirVentanaBusqueda(query, i);
            }, i * 1000);
        }

        setTimeout(() => {
            busquedaEnProgreso = false;
            log("✅ Búsqueda completada en todas las páginas.");
        }, sitiosBusqueda.length * 1000 + 500);
    }

    function abrirVentanaBusqueda(query, index) {
        const sitio = sitiosBusqueda[index];
        const urlFinal = sitio.url.replace('X', encodeURIComponent(query));
        window.open(urlFinal, '_blank');
        log(`> (${index + 1}/${sitiosBusqueda.length}) Abriendo ${sitio.nombre}...`);
    }

    function abrirEnlace(url) {
        log(`Abriendo enlace: ${url}`);
        window.open(url, '_blank');
    }

    // --- HISTORIAL ---
    function guardarEnHistorial(query) {
        let historial = JSON.parse(localStorage.getItem('cineflixHistory')) || [];
        const fecha = new Date();
        const fechaStr = fecha.toLocaleDateString() + ' ' + fecha.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        historial.unshift({ titulo: query, fecha: fechaStr });
        if (historial.length > 5) historial.pop();
        localStorage.setItem('cineflixHistory', JSON.stringify(historial));
        renderizarHistorial();
    }

    function renderizarHistorial() {
        const lista = document.getElementById('historyList');
        const historial = JSON.parse(localStorage.getItem('cineflixHistory')) || [];
        lista.innerHTML = '';

        if (historial.length === 0) {
            lista.innerHTML = '<div style="color:#999; text-align:center; padding-top:15px; font-size:11px;">No hay búsquedas recientes</div>';
            return;
        }

        historial.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `<span>${item.titulo}</span> <span style="color:#888; font-size:10px;">${item.fecha}</span>`;
            lista.appendChild(div);
        });
    }

    function limpiarHistorial() {
        if(confirm("¿Estás seguro de borrar el historial?")) {
            localStorage.removeItem('cineflixHistory');
            renderizarHistorial();
            log("Historial borrado.");
        }
    }

    // --- UTILIDADES ---
    function log(mensaje) {
        const consola = document.getElementById('logConsole');
        const linea = document.createElement('div');
        linea.textContent = `> ${mensaje}`;
        consola.appendChild(linea);
        consola.scrollTop = consola.scrollHeight;
    }

    // --- INICIALIZACIÓN ---
    window.onload = function() {
        cargarSitios();
        renderizarHistorial();
        log("Sistema listo. Escribe y presiona Enter.");
        log(`📚 ${sitiosBusqueda.length} páginas cargadas.`);

        document.getElementById('movieInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                realizarBusqueda();
            }
        });

        document.getElementById('modalConfig').addEventListener('click', function(e) {
            if (e.target === this) {
                cerrarModal();
            }
        });
    };
</script>

</body>
</html>
